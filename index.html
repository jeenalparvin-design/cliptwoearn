<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Watch & Earn · Telegram Mini App</title>
    <!-- Ad SDK placed exactly below <head> as required -->
    <script src='//libtl.com/sdk.js' data-zone='11856479' data-sdk='show_11856479'></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0b1120 0%, #19233c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            color: #eef2ff;
        }

        .app-card {
            max-width: 480px;
            width: 100%;
            background: rgba(18, 26, 40, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 48px;
            padding: 24px 20px 30px;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(88, 166, 255, 0.2);
            transition: all 0.2s ease;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            padding: 0 6px;
        }

        .avatar {
            background: linear-gradient(135deg, #2b7aff, #1a4fd6);
            width: 54px;
            height: 54px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 10px 18px -5px #2b7aff70;
        }

        .user-info h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(120deg, #ffffff, #b9d4ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-info .badge {
            font-size: 0.75rem;
            background: rgba(43, 122, 255, 0.25);
            padding: 4px 10px;
            border-radius: 100px;
            color: #8bb4ff;
            border: 1px solid #2b7aff60;
            display: inline-block;
            margin-top: 4px;
            font-weight: 500;
            backdrop-filter: blur(4px);
        }

        .balance-panel {
            background: linear-gradient(135deg, #0d1a2e, #0a1322);
            border-radius: 32px;
            padding: 24px 22px;
            margin-bottom: 28px;
            border: 1px solid #2e3f5e;
            box-shadow: inset 0 2px 8px #00000040, 0 8px 18px #00000030;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .balance-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8da3c7;
            font-weight: 500;
        }

        .balance-value {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .balance-value span:first-child {
            font-size: 2.4rem;
            font-weight: 800;
            background: linear-gradient(to right, #ffe27a, #ffb347);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        .balance-value .star {
            font-size: 2.2rem;
            filter: drop-shadow(0 0 12px #ffb34780);
        }

        .earn-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 24px;
        }

        .ad-btn {
            background: linear-gradient(135deg, #1f3a6b, #122b4f);
            border: 1px solid #3f6bb0;
            border-radius: 100px;
            padding: 18px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 10px 20px -8px #00000080, 0 0 0 1px #2b5aa0 inset;
            color: #ffffff;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .ad-btn:active {
            transform: scale(0.97);
            background: linear-gradient(135deg, #1b3360, #0e2342);
            border-color: #5a8ad6;
        }

        .ad-btn.rewarded {
            background: linear-gradient(135deg, #1f4a3a, #0d3325);
            border-color: #2e9e6b;
            box-shadow: 0 10px 20px -8px #00000080, 0 0 0 1px #2e9e6b80 inset;
        }

        .ad-btn.rewarded:active {
            background: linear-gradient(135deg, #1b4233, #0a2a1e);
        }

        .ad-btn.popup {
            background: linear-gradient(135deg, #543b7a, #2e1e4a);
            border-color: #9a6eff;
            box-shadow: 0 10px 20px -8px #00000080, 0 0 0 1px #9a6eff70 inset;
        }

        .ad-btn .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ad-icon {
            font-size: 1.7rem;
            line-height: 1;
        }

        .ad-tag {
            font-size: 0.7rem;
            background: #ffffff20;
            padding: 4px 10px;
            border-radius: 40px;
            font-weight: 400;
            color: #b8d0ff;
        }

        .inapp-info {
            font-size: 0.8rem;
            color: #90a6cc;
            background: #111e30;
            padding: 12px 18px;
            border-radius: 100px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #253e5e;
            margin-top: 4px;
        }

        .inapp-info span:last-child {
            background: #1d3855;
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: 600;
            color: #b3d0ff;
        }

        .status-message {
            margin-top: 16px;
            font-size: 0.9rem;
            text-align: center;
            color: #6f8bb0;
            min-height: 24px;
            transition: all 0.2s;
            padding: 8px 0;
            border-top: 1px solid #1d2b40;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #0f1e30ee;
            backdrop-filter: blur(12px);
            color: #e0edff;
            padding: 14px 28px;
            border-radius: 60px;
            border: 1px solid #2f6fd0;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.25s, transform 0.25s;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 20px 40px -10px black;
            white-space: nowrap;
            font-size: 0.95rem;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .footer-note {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 0.7rem;
            color: #435e7c;
            margin-top: 18px;
        }
    </style>
</head>
<body>
    <div class="app-card" id="app">
        <!-- header -->
        <div class="header">
            <div class="avatar">🎯</div>
            <div class="user-info">
                <h1>Watch & Earn</h1>
                <div class="badge">Telegram Mini App</div>
            </div>
        </div>

        <!-- balance -->
        <div class="balance-panel">
            <div class="balance-label">YOUR BALANCE</div>
            <div class="balance-value">
                <span id="balanceDisplay">0</span>
                <span class="star">⭐</span>
            </div>
        </div>

        <!-- ad actions -->
        <div class="earn-section">
            <!-- Rewarded interstitial -->
            <div class="ad-btn rewarded" id="btnInterstitial">
                <div class="left">
                    <span class="ad-icon">🎬</span>
                    <span>Watch Ad</span>
                </div>
                <span class="ad-tag">+1 ⭐</span>
            </div>

            <!-- Rewarded Popup -->
            <div class="ad-btn popup" id="btnPopup">
                <div class="left">
                    <span class="ad-icon">✨</span>
                    <span>Popup Reward</span>
                </div>
                <span class="ad-tag">+2 ⭐</span>
            </div>

            <!-- In-App Interstitial (auto, info only) -->
            <div class="inapp-info">
                <span>📱 In-App Interstitial</span>
                <span>auto · 2 ads / 6min</span>
            </div>
        </div>

        <div class="status-message" id="statusMsg">
            Tap an ad button to earn stars
        </div>
        <div class="footer-note">
            <span>⚡ powered by libtl</span>
            <span>•</span>
            <span>zone 11856479</span>
        </div>
    </div>

    <!-- simple toast -->
    <div class="toast" id="toast">+1 ⭐ earned!</div>

    <script>
        (function() {
            // ---------- STATE ----------
            let userStars = 0;

            // DOM elements
            const balanceDisplay = document.getElementById('balanceDisplay');
            const statusMsg = document.getElementById('statusMsg');
            const toastEl = document.getElementById('toast');

            // Helper: update balance display
            function updateBalanceUI() {
                balanceDisplay.textContent = userStars;
            }

            // Helper: show toast message
            function showToast(text, isGood = true) {
                toastEl.textContent = text;
                toastEl.style.borderColor = isGood ? '#2f6fd0' : '#b04545';
                toastEl.classList.add('show');
                setTimeout(() => {
                    toastEl.classList.remove('show');
                }, 2000);
            }

            // Helper: set status message
            function setStatus(text) {
                statusMsg.textContent = text;
            }

            // ---------- REWARD FUNCTION (user reward) ----------
            // This will be called after ad completes successfully
            function rewardUser(amount = 1, message = 'Reward granted!') {
                userStars += amount;
                updateBalanceUI();
                showToast(`+${amount} ⭐ ${message}`, true);
                setStatus(`🎉 +${amount} star${amount > 1 ? 's' : ''} added!`);

                // optional: save to Telegram cloud / local storage
                if (window.Telegram?.WebApp?.CloudStorage) {
                    // just demo, not required
                    // Telegram.WebApp.CloudStorage.setItem('stars', userStars.toString());
                }
            }

            // ---------- 1. REWARDED INTERSTITIAL ----------
            document.getElementById('btnInterstitial').addEventListener('click', function() {
                setStatus('Loading rewarded interstitial…');

                // Ensure show_11856479 exists (from SDK)
                if (typeof show_11856479 !== 'function') {
                    setStatus('❌ Ad SDK not loaded. Please try again.');
                    showToast('Ad SDK missing', false);
                    return;
                }

                // Call the rewarded interstitial (original code from prompt)
                show_11856479().then(() => {
                    // ----- user reward function here -----
                    // This runs after user watches the ad
                    rewardUser(1, 'from interstitial!');
                }).catch((e) => {
                    // Handle error gracefully (user closed early, no fill, etc)
                    console.warn('Interstitial ad error / closed early:', e);
                    setStatus('⚠️ Ad not completed. No reward this time.');
                    showToast('Ad not finished', false);
                });
            });

            // ---------- 2. REWARDED POPUP ----------
            document.getElementById('btnPopup').addEventListener('click', function() {
                setStatus('Opening rewarded popup…');

                if (typeof show_11856479 !== 'function') {
                    setStatus('❌ Ad SDK not loaded. Please try again.');
                    showToast('Ad SDK missing', false);
                    return;
                }

                // show_11856479('pop') – as per prompt
                show_11856479('pop').then(() => {
                    // user watched ad till the end or closed it in interstitial format
                    // your code to reward user for rewarded format
                    rewardUser(2, 'from popup!');
                }).catch((e) => {
                    // user got error during playing ad (or closed early)
                    console.warn('Popup reward error/closed:', e);
                    setStatus('⚠️ Popup not completed. No reward.');
                    showToast('Popup cancelled', false);
                });
            });

            // ---------- 3. IN-APP INTERSTITIAL (auto, with settings from prompt) ----------
            // We initialize it once when the app loads.
            // Use exactly the configuration from the instructions:
            // frequency: 2, capping: 0.1, interval: 30, timeout: 5, everyPage: false
            function initInAppInterstitial() {
                if (typeof show_11856479 !== 'function') {
                    console.warn('SDK not ready for inApp');
                    return;
                }
                try {
                    show_11856479({
                        type: 'inApp',
                        inAppSettings: {
                            frequency: 2,
                            capping: 0.1,
                            interval: 30,
                            timeout: 5,
                            everyPage: false
                        }
                    });
                    console.log('✅ In-App Interstitial initialized (auto ads)');
                    setStatus('In-App ads ready (auto)');
                } catch (e) {
                    console.warn('InApp init error:', e);
                }
            }

            // ---------- INIT ----------
            // Set initial balance (demo 0, but you could load from storage)
            userStars = 0;
            updateBalanceUI();
            setStatus('Tap an ad button to earn stars');

            // Small delay to ensure SDK script is fully parsed (but it's already loaded in head)
            // We can call init immediately, but sometimes SDK needs a tick.
            // Use a small timeout to be safe.
            setTimeout(() => {
                initInAppInterstitial();
            }, 300);

            // Expose reward function globally in case needed (optional)
            window.rewardUser = rewardUser;

            // Optional: handle Telegram WebApp ready
            if (window.Telegram?.WebApp) {
                Telegram.WebApp.ready();
                // You could expand to full height
                Telegram.WebApp.expand();
            }
        })();
    </script>
</body>
</html>
