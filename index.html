<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <!-- Telegram Mini App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag SDK -->
  <script
    src="//libtl.com/sdk.js"
    data-zone="11856479"
    data-sdk="show_11856479">
  </script>

  <title>Rewarded Ad</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 15px;
    }

    button {
      padding: 14px 25px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h2>🎁 Earn Coins</h2>

  <p>Watch an ad and receive 10 coins.</p>

  <button id="watchAd">
    📺 Watch Ad & Earn 10 Coins
  </button>

  <div id="status"></div>

  <script>
    // Telegram Mini App
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    const button = document.getElementById("watchAd");
    const status = document.getElementById("status");

    // Example reward function
    function giveReward() {

      const reward = 10;

      // এখানে আপনার নিজের reward system বসাবেন
      console.log("User earned:", reward, "coins");

      status.textContent =
        `🎉 Congratulations! You received ${reward} coins.`;
    }

    button.addEventListener("click", async () => {

      button.disabled = true;
      status.textContent = "⏳ Loading ad...";

      try {

        if (typeof show_11856479 !== "function") {
          throw new Error("Monetag SDK is not loaded.");
        }

        // Monetag Rewarded Interstitial
        await show_11856479();

        // Ad successfully completed
        giveReward();

      } catch (error) {

        console.error("Monetag error:", error);

        status.textContent =
          "❌ Ad could not be shown. Please try again.";

      } finally {

        button.disabled = false;

      }

    });
  </script>

</body>
</html>
