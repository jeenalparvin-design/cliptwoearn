<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag -->
  <script
    src="//libtl.com/sdk.js"
    data-zone="11856479"
    data-sdk="show_11856479">
  </script>

  <title>My Telegram Mini App</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px 15px;
    }

    #adButton {
      padding: 14px 24px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #status {
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h2>🎁 Watch Ad</h2>

  <button id="adButton">
    Watch Ad
  </button>

  <div id="status"></div>

  <script>
    // Telegram Mini App
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    const button = document.getElementById("adButton");
    const status = document.getElementById("status");

    button.addEventListener("click", async function () {

      button.disabled = true;
      status.textContent = "Opening ad...";

      try {

        if (typeof show_11856479 !== "function") {
          throw new Error("Monetag SDK is not loaded yet.");
        }

        await show_11856479({
          type: "pop",
          requestVar: "telegram_mini_app"
        });

        status.textContent = "Ad completed.";

      } catch (error) {

        console.error("Monetag error:", error);

        status.textContent =
          "Ad is unavailable right now.";

      } finally {

        button.disabled = false;

      }
    });
  </script>

</body>
</html>
